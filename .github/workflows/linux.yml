name: Linux application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['linux/**', 'windows/**', 'contracts/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'windows/**', 'contracts/**', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install Linux build and isolated desktop tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libxfixes-dev ffmpeg xvfb xauth openbox xdotool libgtk-3-0 libnss3 libgbm1 libasound2t64
      - name: Install pinned dependencies and offline models
        run: |
          npm ci --no-fund
          python3 ../scripts/prepare-windows-search-models.py
          python3 ../scripts/prepare-windows-search-models.py --check
          npm run build:linux-native
      - name: Shared behavior, security and Linux codec/autostart tests
        run: |
          npm test
          npm run test:linux
          python3 ../scripts/test-cross-platform-parity.py
          python3 ../scripts/test-library-keyboard-parity.py
          python3 ../scripts/check-release-version.py --require-windows
        env:
          CLIPBOARDLINE_PARITY_REPORT: ../validation/linux/parity/shelves.json
          CLIPBOARDLINE_LIBRARY_KEYBOARD_REPORT: ../validation/linux/parity/library.json
      - name: Linux source runtime on an isolated X11 desktop
        run: xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' sh -c 'unset WAYLAND_DISPLAY; openbox --sm-disable >/dev/null 2>&1 & npm run test:linux:electron'
        env:
          CLIPBOARDLINE_ISOLATED_DISPLAY: '1'
          XDG_SESSION_TYPE: x11
      - name: Build AppImage and Debian packages
        run: npm run dist:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Linux packaged runtime on an isolated X11 desktop
        run: xvfb-run -a -s '-screen 0 1440x900x24 -nolisten tcp' sh -c 'unset WAYLAND_DISPLAY; openbox --sm-disable >/dev/null 2>&1 & npm run test:linux:electron'
        env:
          CLIPBOARDLINE_ISOLATED_DISPLAY: '1'
          XDG_SESSION_TYPE: x11
          CLIPBOARDLINE_EXECUTABLE: dist/linux-unpacked/clipboardline
      - name: Audit source before upload
        run: python3 ../scripts/audit-public.py --report ../validation/linux/source-audit.json
      - name: Preserve Linux packages and exact-source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipboardline-linux-${{ github.sha }}
          path: |
            windows/dist/ClipBoardLine-*.AppImage
            windows/dist/ClipBoardLine-*.deb
            validation/linux/**
          if-no-files-found: error
          retention-days: 14
