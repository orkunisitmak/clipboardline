name: Linux application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['windows/**', 'packaging/**', 'contracts/**', 'scripts/check-cross-platform-parity.py', 'scripts/test-cross-platform-parity.py', 'scripts/check-library-keyboard-parity.py', 'scripts/test-library-keyboard-parity.py', 'scripts/check-release-version.py', 'scripts/sync-windows-locales.py', 'scripts/test-windows-search-models.py', 'scripts/prepare-windows-search-models.py', '.github/workflows/linux.yml']
  pull_request:
    paths: ['windows/**', 'packaging/**', 'contracts/**', 'scripts/check-cross-platform-parity.py', 'scripts/test-cross-platform-parity.py', 'scripts/check-library-keyboard-parity.py', 'scripts/test-library-keyboard-parity.py', 'scripts/check-release-version.py', 'scripts/sync-windows-locales.py', 'scripts/test-windows-search-models.py', 'scripts/prepare-windows-search-models.py', '.github/workflows/linux.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install display, clipboard and media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb sway wl-clipboard dbus-x11 xclip xdotool ffmpeg libarchive-tools rpm
      - name: Install pinned dependencies
        run: npm ci --no-fund
      - name: Prepare pinned offline image search models
        run: |
          python3 ../scripts/test-windows-search-models.py
          python3 ../scripts/prepare-windows-search-models.py
          python3 ../scripts/prepare-windows-search-models.py --check
      - name: Shared version check
        run: python3 ../scripts/check-release-version.py --require-windows
      - name: Model, renderer and Linux bridge tests
        run: |
          # Shipped dependencies stay at moderate. Packaging tools stay at high:
          # electron-builder pins minimatch below the GHSA-g3hv-75wg-m249 fix.
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high
          # npm counts Electron as a dev tool, but it is the runtime in every package.
          audit="$(npm audit --json || true)"
          jq -e '.metadata.vulnerabilities and ((.vulnerabilities.electron.severity // "none") | IN("none", "info", "low"))' <<<"$audit"
          python3 ../scripts/sync-windows-locales.py --check
          python3 ../scripts/test-cross-platform-parity.py
          python3 ../scripts/test-library-keyboard-parity.py
          npm test
        env:
          CLIPBOARDLINE_PARITY_REPORT: validation/parity/linux.json
      - name: Real Linux Electron clipboard acceptance (X11)
        run: xvfb-run -a npm run test:linux
      - name: Real Linux Electron clipboard acceptance (Wayland, headless Sway)
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"; chmod 700 "$XDG_RUNTIME_DIR"
          WLR_BACKENDS=headless WLR_LIBINPUT_NO_DEVICES=1 WLR_RENDERER=pixman sway -c /dev/null > "$RUNNER_TEMP/sway.log" 2>&1 &
          for attempt in $(seq 50); do socket=$(ls "$XDG_RUNTIME_DIR" | grep -E '^wayland-[0-9]+$' | head -1); [ -n "$socket" ] && break; sleep 0.2; done
          test -n "$socket" || { cat "$RUNNER_TEMP/sway.log"; exit 1; }
          WAYLAND_DISPLAY="$socket" dbus-run-session -- npm run test:linux
        env:
          XDG_SESSION_TYPE: wayland
          XDG_CURRENT_DESKTOP: sway
      - name: Build AppImage, deb, rpm and pacman packages
        run: npm run dist:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clipboardline-linux-${{ github.sha }}
          path: |
            windows/dist/*.AppImage
            windows/dist/*.deb
            windows/dist/*.rpm
            windows/dist/*.pacman
          if-no-files-found: error
          retention-days: 14
