name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release-version.json', 'upstream-state.json', 'windows/**', 'Sources/**', 'Tests/**', 'contracts/**', 'scripts/check-cross-platform-parity.py', 'scripts/test-cross-platform-parity.py', 'scripts/check-release-version.py', 'scripts/test-release-version.py', '.github/workflows/macos.yml', '.github/workflows/windows.yml']
  pull_request:
    paths: ['release-version.json', 'upstream-state.json', 'windows/**', 'Sources/**', 'Tests/**', 'contracts/**', 'scripts/check-cross-platform-parity.py', 'scripts/test-cross-platform-parity.py', 'scripts/check-release-version.py', 'scripts/test-release-version.py', '.github/workflows/macos.yml', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-fund
      - name: Prepare pinned offline image search models
        run: |
          python ../scripts/test-windows-search-models.py
          python ../scripts/prepare-windows-search-models.py
          python ../scripts/prepare-windows-search-models.py --check
      - name: Shared version and parity guard tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python ../scripts/check-release-version.py --require-windows
          python ../scripts/test-release-version.py
          python ../scripts/sync-windows-locales.py --check
          python ../scripts/test-cross-platform-parity.py
      - name: Audit dependencies and run model/security tests
        run: |
          npm audit --audit-level=moderate
          npm test
        env:
          CLIPBOARDLINE_PARITY_REPORT: validation/parity/windows.json
      - name: Real Windows Electron runtime acceptance
        run: npm run test:electron
        env:
          CLIPBOARDLINE_VALIDATION: validation/source
      - name: Build per-user NSIS installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Execute packaged Windows application acceptance
        run: npm run test:electron
        env:
          CLIPBOARDLINE_EXECUTABLE: dist/win-unpacked/ClipBoardLine.exe
          CLIPBOARDLINE_VALIDATION: validation/packaged
      - name: Install NSIS package into an isolated per-user location
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'clipboardline-installed'
          $package = Get-Content package.json | ConvertFrom-Json
          $installer = (Get-Item ('dist/ClipBoardLine-Setup-' + $package.version + '-x64.exe')).FullName
          $process = Start-Process $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed: $($process.ExitCode)" }
          if (-not (Test-Path (Join-Path $destination 'ClipBoardLine.exe'))) { throw 'Installed executable is missing.' }
          "CLIPBOARDLINE_INSTALLED_EXECUTABLE=$(Join-Path $destination 'ClipBoardLine.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Execute installed Windows application acceptance
        run: |
          $env:CLIPBOARDLINE_EXECUTABLE = $env:CLIPBOARDLINE_INSTALLED_EXECUTABLE
          npm run test:electron
        env:
          CLIPBOARDLINE_VALIDATION: validation/installed
      - name: Real signed updater replacement, data preservation and automatic reopen
        run: node tests/upgrade-smoke.cjs
        env:
          CLIPBOARDLINE_VALIDATION: validation/upgrade
      - name: Check installer format, hash and signing state
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $installer = Get-Item ('dist/ClipBoardLine-Setup-' + $package.version + '-x64.exe')
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try { if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw 'Installer is not a Windows PE executable.' } } finally { $stream.Dispose() }
          $signature = Get-AuthenticodeSignature $installer.FullName
          $result = @{platform='win32';architecture='x64';version=$package.version;build=$package.clipboardLineBuild;installer=$installer.Name;size=$installer.Length;sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();authenticodeStatus=$signature.Status.ToString();sourceRevision=$env:GITHUB_SHA}
          New-Item validation -ItemType Directory -Force | Out-Null
          $result | ConvertTo-Json | Set-Content validation/windows-package.json
          if ($signature.Status -ne 'Valid') { Write-Host '::notice::This build has no configured Windows Authenticode identity; SmartScreen may warn. Ed25519 public release signing is a separate local release step.' }
      - name: Upload Windows installer and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clipboardline-windows-${{ github.sha }}
          path: |
            windows/dist/ClipBoardLine-Setup-*-x64.exe
            windows/validation/**
          if-no-files-found: error
          retention-days: 14
